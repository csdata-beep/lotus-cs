<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS Factory &amp; QC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<style>

/* Layout: navy top bar + left sidebar (same shell as CS DATA SYSTEM), work area on the right; sidebar becomes a chip row on phones */
:root{color-scheme:light;
  --navy:#0c2034;--navy2:#17406a;--cream:#E1E0CC;
  --bg:#EEF1F5;--card:#ffffff;--ink:#16212e;--mut:#5b6b7d;--line:#DDE3EA;--soft:#F4F7FA;
  --accent:#1F4E78;--accent-soft:#e6eef6;
  --ok:#1d7a43;--ok-soft:#e3f5ea;--warn:#a35f00;--warn-soft:#fdf1dc;--bad:#b42318;--bad-soft:#fde4e2;--info:#3d5ccf;--info-soft:#e8ecfb;
  --shadow:0 1px 2px rgba(12,32,52,.06),0 6px 18px rgba(12,32,52,.06);
  --f-display:Archivo,Sarabun,"Segoe UI",sans-serif;--f-body:Sarabun,Tahoma,"Segoe UI",sans-serif;
  --sbw:226px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:radial-gradient(120% 300% at 0% 0%,var(--navy2) 0%,var(--navy) 55%,#081522 100%);color:var(--cream);display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{font-family:var(--f-display);font-size:18px;margin:0;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.top .sub{color:rgba(225,224,204,.6);font-size:13px}
.top .link{display:flex;align-items:center;gap:6px;font-size:12.5px;color:rgba(225,224,204,.85);background:rgba(225,224,204,.08);border:1px solid rgba(225,224,204,.2);border-radius:99px;padding:3px 10px}
.top .link i{width:8px;height:8px;border-radius:50%;background:#5fcf8e;box-shadow:0 0 0 3px rgba(95,207,142,.2)}
.top .sp{flex:1}
.role{display:flex;gap:4px;background:rgba(225,224,204,.08);border-radius:99px;padding:3px}
.role button{border:0;background:none;color:rgba(225,224,204,.75);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px}
.role button.on{background:var(--cream);color:#0a0a0a;font-weight:600}
.shell{display:flex;min-height:calc(100vh - 56px)}
nav.side{width:var(--sbw);flex:none;background:var(--navy);padding:12px 10px 24px;position:sticky;top:56px;align-self:flex-start;height:calc(100vh - 56px);overflow-y:auto}
nav.side .g{font-size:11px;letter-spacing:.07em;color:rgba(225,224,204,.45);padding:12px 12px 4px}
nav.side button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:rgba(225,224,204,.78);text-align:left;padding:9px 12px;border-radius:12px;cursor:pointer;font-size:14px}
nav.side button:hover{background:rgba(225,224,204,.08);color:var(--cream)}
nav.side button.on{background:var(--cream);color:#0a0a0a;font-weight:600}
nav.side svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.side .n{margin-left:auto;font-size:11.5px;background:rgba(225,224,204,.15);border-radius:99px;padding:0 8px;font-variant-numeric:tabular-nums}
nav.side button.on .n{background:#0c2034;color:var(--cream)}
nav.side .n.hot{background:#c2410c;color:#fff}
main{flex:1;min-width:0;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:18px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h2{font-family:var(--f-display);font-size:26px;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.ph p{margin:2px 0 0;color:var(--mut)}
.ph .sp{flex:1}
.demo{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:99px;padding:2px 10px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;display:grid;gap:2px;box-shadow:var(--shadow);border-top:4px solid var(--line)}
.tile:hover{border-color:var(--accent)}
.tile .l{color:var(--mut);font-size:13px}
.tile .v{font-family:var(--f-display);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;font-weight:500;color:var(--mut);margin-left:4px;font-family:var(--f-body)}
.tile .s{font-size:12.5px;color:var(--mut)}
.tile.bad{border-top-color:var(--bad)}.tile.bad .v{color:var(--bad)}
.tile.warn{border-top-color:var(--warn)}.tile.warn .v{color:var(--warn)}
.tile.info{border-top-color:var(--info)}
.tile.ok{border-top-color:var(--ok)}
.g2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media(max-width:980px){.g2{grid-template-columns:1fr}}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:190px;padding-top:18px}
.bar{display:grid;grid-template-rows:auto 1fr auto;height:100%;text-align:center;cursor:pointer;border:0;background:none;padding:0}
.bar .c{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.bar .t{display:flex;align-items:flex-end;justify-content:center}
.bar .t i{display:block;width:70%;max-width:46px;background:var(--accent);border-radius:8px 8px 3px 3px;min-height:3px}
.bar.today .t i{background:#c2410c}
.bar .d{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.25}
.bar.today .d{color:var(--ink);font-weight:700}
.pipe{display:flex;gap:6px;flex-wrap:wrap}
.pipe button{flex:1 1 120px;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:2px}
.pipe button b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.pipe button span{font-size:12.5px;color:var(--mut)}
.alist{display:grid;gap:6px}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--soft);cursor:pointer;border:0;text-align:left;width:100%}
.arow:hover{background:var(--accent-soft)}
.arow .x{min-width:0}.arow .x b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .x small{color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-pick{background:var(--info-soft);color:var(--info)}
.p-recv{background:var(--accent-soft);color:var(--accent)}
.p-rep{background:var(--warn-soft);color:var(--warn)}
.p-qc{background:#efe7fb;color:#6b3fb8}
.p-ready{background:var(--ok-soft);color:var(--ok)}
.p-done{background:var(--soft);color:var(--mut);border:1px solid var(--line)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-doc{background:var(--warn-soft);color:var(--warn)}
.p-docok{background:var(--ok-soft);color:var(--ok)}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:99px;padding:7px 16px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn.g{background:transparent;color:var(--accent)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 12px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.day{display:grid;gap:10px}
.dayh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayh h3{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600}
.dayh .cnt{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--accent)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.row .who{min-width:0;cursor:pointer}
.row .who b{font-weight:700}
.row .who .m{color:var(--mut);font-size:13px}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.colh{display:flex;align-items:center;gap:8px;padding:2px 4px 4px}
.colh b{font-size:14.5px}.colh span{margin-left:auto;font-family:var(--f-display);font-weight:700;color:var(--mut)}
.kc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;box-shadow:var(--shadow)}
.kc .top2{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kc .svo{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--accent);cursor:pointer;border:0;background:none;padding:0}
.kc .nm{font-weight:700;cursor:pointer}
.kc .m{color:var(--mut);font-size:12.5px}
.kc .age{margin-left:auto;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.kc .age.late{color:var(--bad);font-weight:700}
.kc .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:16px 8px;border:1px dashed var(--line);border-radius:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--accent);color:#fff;text-align:left;font-weight:600;padding:9px 10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--soft)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tb input,.tb select,.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;min-width:0}
.tb input{flex:1 1 220px}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(8,21,34,.5);z-index:20;display:flex;justify-content:flex-end}
.dr{width:min(640px,100%);height:100%;background:var(--bg);overflow-y:auto;display:grid;align-content:start;gap:14px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));padding-left:18px;padding-right:max(18px,env(safe-area-inset-right,0px))}
.drh{display:flex;align-items:flex-start;gap:10px}
.drh h2{margin:0;font-family:var(--f-display);font-size:22px;font-weight:600}
.drh .x{margin-left:auto;border:0;background:var(--card);border-radius:99px;width:34px;height:34px;cursor:pointer;font-size:18px;flex:none}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.kv div{min-width:0}.kv small{display:block;color:var(--mut);font-size:12px}
.steps{display:flex;gap:0;overflow-x:auto;padding:4px 0}
.st{flex:1 0 82px;display:grid;justify-items:center;gap:4px;text-align:center;font-size:11.5px;color:var(--mut);position:relative}
.st::before{content:"";position:absolute;top:10px;left:-50%;right:50%;height:3px;background:var(--line);z-index:0}
.st:first-child::before{display:none}
.st i{width:22px;height:22px;border-radius:50%;background:var(--card);border:3px solid var(--line);z-index:1}
.st.done i{background:var(--ok);border-color:var(--ok)}.st.done::before{background:var(--ok)}
.st.cur i{background:var(--card);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}.st.cur{color:var(--ink);font-weight:700}.st.cur::before{background:var(--ok)}
.sync{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.sync b{font-size:14px}
.sync svg{width:26px;height:26px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.gal button{border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;cursor:zoom-in;background:var(--soft);display:grid;text-align:left}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.gal .cap{font-size:11.5px;padding:4px 6px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal .doc{aspect-ratio:4/3;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--bad);background:var(--bad-soft)}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.gtabs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 11px;cursor:pointer;font-size:12.5px}
.gtabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.log{display:grid;gap:0}
.log div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.log div:first-child{border-top:0}
.log time{color:var(--mut);font-variant-numeric:tabular-nums;font-size:12px}
.log .by{color:var(--mut);font-size:12px}
/* modal */
.md{position:fixed;inset:0;z-index:30;background:rgba(8,21,34,.55);display:grid;place-items:center;padding:16px}
.mdb{background:var(--card);border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow-y:auto;display:grid;gap:12px;padding:18px}
.mdb h3{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600}
.fld{display:grid;gap:4px}.fld label{font-size:12.5px;color:var(--mut);font-weight:600}
.chk{display:grid;gap:6px}
.chk label{display:flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.up{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img,.thumbs .doc{width:72px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs .doc{display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--bad);background:var(--bad-soft)}
.mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--bad);font-size:13px}
.lb{position:fixed;inset:0;z-index:40;background:rgba(5,10,16,.97);display:grid;grid-template-rows:1fr auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;max-height:100%;margin:auto;display:block;border-radius:8px;object-fit:contain;min-height:0}
.lb .lbi{min-height:0;display:grid}
.lb .bar2{display:flex;gap:10px;align-items:center;justify-content:center;color:#E1E0CC;padding-top:10px;flex-wrap:wrap}
.lb button{border:1px solid rgba(225,224,204,.4);background:none;color:#E1E0CC;border-radius:99px;padding:6px 14px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:9px 16px;border-radius:99px;z-index:50;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mapc{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card);display:grid;gap:6px;align-content:start}
.mapc .who{font-size:11.5px;color:var(--mut);letter-spacing:.04em}
.mapc .a1{font-size:12.5px;border-top:1px dashed var(--line);padding-top:6px;color:var(--mut)}
.mapc .a1 b{color:var(--ink)}
.note{font-size:13px;color:var(--mut)}
.hb{display:grid;gap:10px;padding-top:4px}
.hbr{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 2.2em;gap:10px;align-items:center;font-size:13.5px}
.hbl{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbt{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.hbt i{display:block;height:100%;background:var(--accent);border-radius:7px;min-width:3px}
.hbr b{text-align:right;font-variant-numeric:tabular-nums}
.note b{color:var(--ink)}
/* mobile: bottom tab bar, one list at a time, big tap targets */
.bnav,.seg,.mlist,.dr-foot,.sheet{display:none}
@media(max-width:820px){
  body{font-size:15px}
  .shell{display:block;min-height:0}
  nav.side{display:none}
  .top{gap:8px;padding-block:8px}
  .top h1{font-size:16px}
  .top .sub,.top .link,.top .sp{display:none}
  .role{margin-left:auto}
  .role button{padding:5px 10px;font-size:12.5px}
  main{padding-block:14px calc(92px + env(safe-area-inset-bottom,0px))}
  .wrap{gap:14px}
  .ph h2{font-size:22px}.ph p{font-size:13.5px}
  .ph .demo{order:-1}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{padding:12px;border-radius:14px}
  .tile .v{font-size:28px}.tile .l{font-size:12.5px;line-height:1.3}.tile .s{font-size:12px}
  .card{padding:14px;border-radius:14px}
  .bars{gap:4px;height:160px}
  .pipe button{flex:1 1 40%}
  .row{grid-template-columns:1fr;padding:12px}
  .row .acts{justify-content:stretch}
  .row .acts .btn{flex:1;padding:11px 14px;font-size:14.5px}
  .row .acts .pill{align-self:center}
  .board,.tw.desk{display:none}
  .seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .seg button{justify-content:center;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:14px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
  .seg button b{font-variant-numeric:tabular-nums}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .mlist{display:grid;gap:10px}
  .mlist .kc{padding:12px;gap:8px}
  .mlist .kc .acts .btn{flex:1;padding:11px 14px;font-size:14.5px}
  .kv{grid-template-columns:1fr 1fr;gap:10px 12px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(12,32,52,.08);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bnav button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:8px 2px 7px;font-size:11.5px;color:var(--mut);cursor:pointer;position:relative;min-height:58px}
  .bnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bnav button.on{color:var(--accent);font-weight:700}
  .bnav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
  .bnav .n{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:#c2410c;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
  .sheet{display:block;position:fixed;inset:0;z-index:25;background:rgba(8,21,34,.45)}

  modal(on?'ลูกค้าขอเอกสารผลตรวจ':'ยกเลิกคำขอเอกสาร',sub(c)+`<div class="note">${on?'QC จะต้องออกเอกสารผลตรวจหลังซ่อมเสร็จ และขึ้นแจ้งเตือนจนกว่าจะส่งลูกค้า':'จะไม่ขึ้นแจ้งเตือนเรื่องเอกสารของเคสนี้'} · บันทึกลงช่อง "ลูกค้าขอเอกสารผลตรวจ" ใน SVO</div>`,
  'ยืนยัน',async()=>{await doAct(key,'docreq',{on},'','','บันทึกแล้ว');});}
/* QC */
function actStart(key){const c=caseByKey(key);
  modal('รับเข้าซ่อม · '+esc(c.svo),sub(c)+`<div class="note">อาการที่แจ้ง: ${esc(c.prob||'-')}</div><div class="fld"><label>ไลน์ซ่อม</label><select id="ln">${B.lines.map(l=>`<option>${esc(l)}</option>`).join('')}</select></div><div class="fld"><label>ประเมินอาการ</label><textarea id="ev" rows="2" placeholder="เช่น เปลี่ยนสปริงชุดกลาง / ซ่อมขาเตียง"></textarea></div>`,
  'รับเข้าซ่อม',async()=>{await doAct(key,'start',{line:$('#ln').value,eval:$('#ev').value},'','',c.svo+' รับเข้าซ่อมแล้ว');});}
function actFinish(key){const c=caseByKey(key);
  modal('ซ่อมเสร็จ · ตรวจ QC · '+esc(c.svo),sub(c)+`<div class="fld"><label>สิ่งที่ซ่อม</label><textarea id="fx" rows="2" placeholder="เช่น เปลี่ยนสปริงชุดกลาง 12 ตัว"></textarea></div>
   <div class="fld"><label>รายการตรวจ QC (ติ๊กข้อที่ผ่าน)</label><div class="chk">${B.qc.map((q,i)=>`<label><input type="checkbox" id="q${i}" value="${esc(q)}"> ${esc(q)}</label>`).join('')}</div></div>`+upBox('รูปหลังซ่อม / ผลตรวจ',1)+
   `<div class="fld"><label>ผลการตรวจ</label><select id="qr"><option value="pass">ผ่าน · ส่งคืน CS โรงงาน</option><option value="fail">ไม่ผ่าน · ซ่อมซ้ำ</option></select></div><div class="fld"><label>เหตุผลถ้าไม่ผ่าน</label><textarea id="qn" rows="2"></textarea></div>`,
  'บันทึกผล',async()=>{const items=B.qc.filter((_,i)=>$('#q'+i).checked);const pass=$('#qr').value==='pass';
   if(!PEND.length)throw new Error('แนบรูปหลังซ่อมอย่างน้อย 1 รูป');
   if(pass&&items.length<B.qc.length)throw new Error('ผ่าน QC ได้เมื่อติ๊กครบทุกข้อ');
   if(!pass&&!$('#qn').value.trim())throw new Error('ใส่เหตุผลที่ไม่ผ่าน');
   await doAct(key,'finish',{pass,items,fix:$('#fx').value,reason:$('#qn').value},pass?'QC':'REPAIR',pass?'หลังซ่อม · QC ผ่าน':'QC ไม่ผ่าน',pass?c.svo+' ผ่าน QC · ขึ้นที่ CS หน้า "รับกลับ"'+(c.docReq?' · อย่าลืมออกเอกสาร':''):c.svo+' ไม่ผ่าน · ยังอยู่ในหน้าที่นอนซ่อม');});}

function irChart(unit,init,ret,lo,hi,min,max,ticks){
  const W=640,H=230,L=56,R=20,T=14,B=40,ph=H-T-B,pw=W-L-R,y=v=>T+ph-(Math.max(min,Math.min(max,v))-min)/(max-min)*ph;

  const bt=y(hi),bb=y(lo),bw=110,cx=[L+pw*.3,L+pw*.7];
  const bar=(x,v,col,lab)=>v==null?'':`<rect x="${x-bw/2}" y="${y(v)}" width="${bw}" height="${T+ph-y(v)}" fill="${col}" rx="2"/><text x="${x}" y="${y(v)-6}" font-size="13" font-weight="700" text-anchor="middle">${v}</text><text x="${x}" y="${H-B+18}" font-size="12" text-anchor="middle">${lab}</text>`;

   <text x="14" y="${T+ph/2}" font-size="11" fill="#555" transform="rotate(-90 14 ${T+ph/2})" text-anchor="middle">${unit}</text></svg>`;}

      if(i)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',.88),'JPEG',0,0,210,297);}
    return pdf.output('datauristring').split(',')[1];}finally{host.remove();}}
function irSave(){return JSON.stringify({type:IR.type,issue:IR.issue,wy:IR.wy,s2a:IR.s2a,s2b:IR.s2b,s2c:IR.s2c,tDate:IR.tDate,tolF:IR.tolF,tolH:IR.tolH,tests:IR.tests,a:IR.a,hdr:IR.hdr,g:IR.g,ph:IR.ph.filter(p=>p.on).map(p=>p.fid)});}
const irName=()=>String(IR.d.svo||IR.key).replace(/[^\w-]/g,'_')+'_InspectionReport.pdf';
async function irBusy(on,txt){const v=$('#irv');if(!v)return;if(on)v.dataset.busy='1';else delete v.dataset.busy;['#irdl','#irok'].forEach(s=>{const b=$(s);if(b){b.disabled=on;if(on&&s==='#irok')b.dataset.t=b.textContent;if(on&&s==='#irok'&&txt)b.textContent=txt;if(!on&&b.dataset.t){b.textContent=b.dataset.t;}}});}
async function irDownload(){$('#irerr').textContent='';if(IR&&IR.upBusy)return $('#irerr').textContent='รออัปโหลดรูปให้เสร็จก่อน';await irBusy(true,'กำลังสร้าง PDF…');
  try{const b64=await irPdf();const bin=atob(b64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([arr],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download=irName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
  catch(e){$('#irerr').textContent=e.message||String(e);}finally{irBusy(false);}}
async function irIssue(){const err=$('#irerr');err.textContent='';
  if(IR.upBusy)return err.textContent='รออัปโหลดรูปให้เสร็จก่อน';
  if(!IR.tDate)return err.textContent='กรอก Test Date';
  const miss=IR.tests.filter(t=>t.k!=='x'&&t.k!=='app'&&(irNum(t.i)==null||irNum(t.r)==null));if(miss.length)return err.textContent='กรอกค่า Initial / Returned ให้ครบ: '+miss.map(t=>t.name).join(', ');
  if(IR.tests.some(t=>t.k==='x'&&!String(t.name).trim()))return err.textContent='ใส่ชื่อรายการทดสอบที่เพิ่มเอง';
  if(irState()==='fail'&&!IR.failOk){IR.failOk=true;return err.textContent='มีรายการที่ FAIL — ตรวจสอบอีกครั้ง ถ้ายืนยันจะออกเอกสารตามนี้ กด "ออกเอกสาร" อีกครั้ง';}
  const key=IR.key;await irBusy(true,'กำลังสร้าง PDF…');
  try{const b64=await irPdf();const bt=$('#irok');if(bt)bt.textContent='กำลังแนบเข้าเคส…';
    const r=await call('facUpload',key,'DOC',irName(),'application/pdf',b64,'เอกสารผลตรวจ (Inspection Report)');
    await call('facAction',key,'docissue',{report:irSave()});
    if(r&&r.fid)call('facNotify',key,'DOC',[r.fid],'เอกสารผลตรวจ (Inspection Report)').catch(()=>{});
    irBusy(false);irClose();toast('ออกเอกสารผลตรวจแล้ว · แนบ PDF เข้าเคส · รอ CS โรงงานส่งลูกค้า');await reload();if(OPEN===key)openCase(key);}
  catch(e){err.textContent=e.message||String(e);irBusy(false);}}


/* ---------- QC: ตั้งค่าหัวกระดาษเอกสารผลตรวจ (ตามแบรนด์) ---------- */
let HDRL=null;const HDRI={};
function hdrLoad(){call('facHdrList').then(r=>{HDRL=r;if(VIEW==='hdr')render();}).catch(e=>{toast(e.message);});}
function vHdr(){const h=head('หัวกระดาษเอกสาร','หัวกระดาษของเอกสารผลตรวจ (Inspection Report) แยกตามแบรนด์');
  if(!HDRL){hdrLoad();return h+'<div class="card" style="padding:16px"><div class="note">กำลังโหลด…</div></div>';}
  setTimeout(hdrThumbs,0);
  const none=b=>HDRL.def?'ยังไม่มี · ใช้หัวกระดาษกลาง':(/^BG\b|BEDGEAR/i.test(b)?'ยังไม่มี · ใช้หัว Bedgear ในระบบ':'ยังไม่มี · ใช้หัว Lotus ในระบบ');
  const row=(b,label,fid)=>`<div class="hdr-row"><div><b>${esc(label)}</b>${fid?'':`<div class="note">${b==='*'?'ยังไม่ตั้ง · แบรนด์ที่ไม่มีรูปใช้หัว Lotus / Bedgear ในระบบ':none(b)}</div>`}</div>
   <div class="hdr-img" data-hb="${esc(b)}" data-fid="${fid?1:''}">${fid?'<span class="note">กำลังโหลด…</span>':'<span class="note">—</span>'}</div>
   <div class="hdr-act"><label class="btn ${fid?'g ':''}sm" style="cursor:pointer">${fid?'เปลี่ยนรูป':'อัปโหลด'}<input type="file" accept="image/jpeg,image/png" hidden data-b="${esc(b)}" onchange="hdrPick(this)"></label>${fid?`<button type="button" class="btn g sm" data-b="${esc(b)}" onclick="hdrDel(this.dataset.b)">ลบ</button>`:''}</div></div>`;
  return h+`<div class="card" style="padding:14px 16px">
   <div class="note">ขนาดแนะนำ <b>2000 × 440 px</b> (สัดส่วนประมาณ 4.5 : 1) · JPG หรือ PNG พื้นหลังสีขาว · ไม่เกิน 3 MB · ใส่โลโก้ สโลแกน ช่องทางติดต่อ และเส้นคั่นด้านล่างไว้ในรูปเลย
   <br>ตอน QC ออกเอกสาร ระบบเลือกหัวกระดาษตามแบรนด์ของเคสให้อัตโนมัติ · แบรนด์ที่ยังไม่มีรูปใช้ "หัวกระดาษกลาง"${HDRL.online?'':'<br><b>ตัวรันในออฟฟิศ: ดูได้อย่างเดียว · อัปโหลด/ลบได้ที่เว็บออนไลน์</b>'}</div>
   ${row('*','หัวกระดาษกลาง',HDRL.def)}${HDRL.rows.map(r=>row(r.brand,r.brand,r.fid)).join('')}</div>`;}
function hdrThumbs(){document.querySelectorAll('.hdr-img[data-fid="1"]').forEach(el=>{const b=el.dataset.hb;
  const put=src=>{if(el.isConnected)el.innerHTML=src?`<img src="${src}" alt="">`:'<span class="note">เปิดรูปไม่ได้</span>';};
  if(HDRI[b]!==undefined){put(HDRI[b]);return;}
  call('facHdrImg',b,true).then(r=>{HDRI[b]=r&&r.b64?'data:'+r.mime+';base64,'+r.b64:'';put(HDRI[b]);}).catch(()=>put(''));});}
function hdrPick(inp){const f=inp.files&&inp.files[0],b=inp.dataset.b;inp.value='';if(!f)return;
  if(!/^image\/(jpeg|png)$/.test(f.type))return toast('รองรับเฉพาะ JPG / PNG');
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const W=im.naturalWidth,H=im.naturalHeight,k=Math.min(1,2000/W),c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const du=c.toDataURL('image/jpeg',.9),r=W/H,warn=[];
    if(W<1400)warn.push(`ภาพกว้าง ${W} px เล็กกว่าที่แนะนำ (2000 px) อาจไม่คมตอนพิมพ์`);
    if(r<3.5||r>6)warn.push(`สัดส่วน ${r.toFixed(1)} : 1 ต่างจากที่แนะนำ (4.5 : 1) หัวกระดาษอาจ${r<3.5?'สูงจนดันเนื้อหาลง':'เตี้ยเกินไป'}`);
    modal(`หัวกระดาษ · ${esc(b==='*'?'หัวกระดาษกลาง':b)}`,`<div class="hdr-prev"><img src="${du}" alt=""></div><div class="note">ขนาด ${W} × ${H} px${k<1?` · ย่อเป็น ${c.width} × ${c.height} px`:''}</div>${warn.map(w=>`<div class="hdr-warn">${esc(w)}</div>`).join('')}`,
      warn.length?'ใช้รูปนี้ต่อ':'บันทึกหัวกระดาษ',async()=>{await call('facHdrSet',b,'image/jpeg',du.split(',')[1]);HDRI[b]=du;HDRL=null;toast('บันทึกหัวกระดาษแล้ว');render();});};
  im.onerror=()=>{URL.revokeObjectURL(url);toast('เปิดรูปไม่ได้');};im.src=url;}
function hdrDel(b){modal('ลบหัวกระดาษ · '+esc(b==='*'?'หัวกระดาษกลาง':b),`<div class="note">${b==='*'?'แบรนด์ที่ไม่มีรูปจะกลับไปใช้หัว Lotus / Bedgear ในระบบ':'แบรนด์นี้จะกลับไปใช้หัวกระดาษกลาง'} · รูปเดิมย้ายไปถังขยะของ Google Drive (กู้คืนได้ 30 วัน)</div>`,
  'ลบ',async()=>{await call('facHdrDel',b);delete HDRI[b];HDRL=null;toast('ลบหัวกระดาษแล้ว');render();});}
/* แนบไฟล์เอกสารเอง (แบบเดิม) */
function actDocIssueFile(key){const c=caseByKey(key);
  modal('ออกเอกสารผลตรวจสอบ · '+esc(c.svo),sub(c)+`<div class="note">แนบไฟล์เอกสารผลตรวจ (PDF หรือรูป) ที่จะส่งให้ลูกค้า</div>`+upBox('ไฟล์เอกสาร',1),
  'บันทึกเอกสาร',async()=>{if(!PEND.length)throw new Error('แนบไฟล์เอกสารก่อน');await doAct(key,'docissue',{},'DOC','เอกสารผลตรวจ','ออกเอกสารแล้ว · รอ CS ส่งลูกค้า');});}
function addPhotos(key){const c=caseByKey(key);const st=upStagesFor(c);if(!st.length)return;
  const def={RECV:'RECV',WAIT:'RECV',REPAIR:'REPAIR',BACK:'QC',READY:'BACK',OUT:'BACK'}[c.stage];
  modal('เพิ่มรูป / ไฟล์ · '+esc(c.svo),`<div class="fld"><label>ขั้นตอน</label><select id="ps">${st.map(x=>`<option value="${x[0]}" ${x[0]===def?'selected':''}>${x[1]}</option>`).join('')}</select></div>`+upBox('รูปหรือไฟล์ PDF',1)+`<div class="fld"><label>คำอธิบาย</label><input id="pcap" placeholder="เช่น จุดยุบตัวฝั่งซ้าย"></div>`,
  'บันทึกรูป',async()=>{if(!PEND.length)throw new Error('เลือกรูปอย่างน้อย 1 รูป');const n=await uploadPend(key,$('#ps').value,$('#pcap').value||'รูปเพิ่มเติม');toast('บันทึกรูปแล้ว '+n+' ไฟล์');if(OPEN===key)openCase(key);});}
/* ลบ (ADMIN / ADMIN SYSTEM) */
function delFile(k){const p=DET.files[k];const key=OPEN;lbClose();
  modal('ลบรูป / ไฟล์ที่แนบผิด?',`<div class="note">${esc(p.cap||p.name)} · ไฟล์จะถูกย้ายไปถังขยะ ปิดลิงก์รูป และบันทึกในประวัติ<br>ถ้ารูปนี้ถูกส่งเข้ากลุ่ม LINE แล้ว ระบบจะแจ้งกลุ่มว่า "ยกเลิกรูปที่ส่งผิด" ให้อัตโนมัติ</div>`,'ลบไฟล์',async()=>{const r=await call('facDelete','file',key,p.id);toast(r.msg);openCase(key);},'bad');}
function delStep(key){const c=caseByKey(key);const s=ST(c.stage),pv=STAGES[SI[c.stage]-1];
  modal('ย้อนกลับ 1 ขั้นตอน?',sub(c)+`<div class="note">${esc(s.t)} → <b>${esc(pv?pv.t:'')}</b> · ล้างข้อมูลของขั้นปัจจุบัน และปรับสถานะ / วันที่ใน SVO ให้ตรง</div>`,'ย้อนขั้นตอน',async()=>{const r=await call('facDelete','step',key);toast(r.msg);await reload();openCase(key);},'bad');}
function delCase(key){const c=caseByKey(key);
  modal('เอาเคสออกจากโรงงาน?',sub(c)+`<div class="note">ลบข้อมูลโรงงานของเคสนี้ (รูปและประวัติยังอยู่) · ถ้าสถานะ SVO เป็น "สินค้าถึงโรงงานแล้ว" จะกลับเป็น "รอเก็บสินค้า" · ใช้กรณีรับเข้าผิดเคส</div>`,'เอาออก',async()=>{const r=await call('facDelete','case',key);toast(r.msg);closeDrawer();await reload();},'bad');}
/* ---------- โหลดข้อมูล ---------- */
async function reload(force){try{const d=await call('facData');CASES=d.cases.map(toCase);DELIV=d.deliv||[];LOADED=Date.now();render();if(force)toast('อัปเดตข้อมูลแล้ว');}catch(e){if(force)toast(e.message);}}
setInterval(()=>{if(B&&!document.hidden&&!$('.md')&&Date.now()-LOADED>90000)reload();},30000);
let TT=0;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(TT);TT=setTimeout(()=>t.hidden=true,3600);}
/* ---------- เข้าสู่ระบบ ---------- */
let LSTEP='pin';
function showLogin(msg){B=null;$('#app').hidden=true;$('#login').hidden=false;LSTEP='pin';$('#lgPin2Row').hidden=true;$('#lgBtn').textContent='เข้าสู่ระบบ';$('#lgMsg').textContent=msg||'';}
async function doLogin(){const code=$('#lgCode').value.trim(),pin=$('#lgPin').value.trim(),pin2=$('#lgPin2').value.trim();$('#lgMsg').textContent='';
  if(!code){$('#lgMsg').textContent='กรอกรหัสพนักงาน';return;}
  const p=LSTEP==='setup'?{code,newPin:pin}:{code,pin};
  if(LSTEP==='setup'&&pin!==pin2){$('#lgMsg').textContent='PIN ทั้งสองช่องไม่ตรงกัน';return;}
  $('#lgBtn').disabled=true;
  try{const r=await TP.gs('login',p);
    if(r.needSetup){LSTEP='setup';$('#lgPin2Row').hidden=false;$('#lgBtn').textContent='ตั้ง PIN และเข้าสู่ระบบ';$('#lgMsg').textContent='ครั้งแรก: ตั้ง PIN 6–8 หลัก (ห้ามเลขซ้ำ/เลขเรียง)';return;}
    if(r.error){$('#lgMsg').textContent=r.error;return;}
    TP.setTok(r.token);start();}
  catch(e){$('#lgMsg').textContent=e.message;}finally{$('#lgBtn').disabled=false;}}
function logout(){const t=TP.getTok();TP.setTok('');TP.gs('logout',t).catch(()=>{});showLogin('ออกจากระบบแล้ว');}
async function start(){$('#login').hidden=true;$('#app').hidden=false;$('#view').innerHTML='<div class="empty">กำลังโหลด…</div>';
  try{B=await call('facBoot');P=B.perms;try{const md=localStorage.getItem('fac_mode');if(md==='CS'||md==='QC')MODE=md;}catch(e){}let v='';try{v=sessionStorage.getItem('fac_view')||'';}catch(e){}
    VIEW=pagesAllowed().some(p=>p[0]===v)?v:pagesAllowed()[0][0];
    const d=await call('facData');CASES=d.cases.map(toCase);DELIV=d.deliv||[];LOADED=Date.now();render();deepCase();}
  catch(e){if(/เข้าสู่ระบบ/.test(e.message))return;$('#view').innerHTML=`<div class="card" style="margin-top:20px"><b>เปิดเว็บแอปโรงงานไม่ได้</b><div class="err" style="margin-top:6px">${esc(e.message)}</div><div style="margin-top:10px;display:flex;gap:8px"><button class="btn sm" onclick="start()">ลองใหม่</button><button class="btn g sm" onclick="logout()">เข้าสู่ระบบด้วยบัญชีอื่น</button></div></div>`;}}
/* ลิงก์จาก LINE: ...?app=factory&case=รหัสงาน → เปิดเคสนั้นทันทีหลังเข้าสู่ระบบ */
let DEEP_DONE=false;
function deepCase(){if(DEEP_DONE)return;DEEP_DONE=true;const go=p=>{const k=p&&p.case;if(k)setTimeout(()=>openCase(String(k)),300);};
  try{if(window.google&&google.script&&google.script.url)google.script.url.getLocation(l=>go(l.parameter));else go(Object.fromEntries(new URLSearchParams(location.search)));}catch(e){}}
if(TP.getTok())start();else showLogin('');

</script>
